{% extends "base.html" %}
{% block title %}Đăng nhập{% endblock %}
{% block content %}
<h1>Đăng nhập</h1>
{% if error %}<p style="color:red">{{ error }}</p>{% endif %}
<form method="post" action="{{ url_for('login') }}">
  <p><label>Tên đăng nhập: <input type="text" name="username" autocomplete="username"></label></p>
  <p><label>Mật khẩu: <input type="password" name="password" autocomplete="current-password"></label></p>
  <button type="submit">Đăng nhập</button>
</form>
{% if user %}
  <p>Chào <strong>{{ user }}</strong>. <a href="{{ url_for('logout') }}">Đăng xuất</a></p>
{% endif %}
<p><a href="{{ url_for('index') }}">Trang chủ</a></p>
{% endblock %}
